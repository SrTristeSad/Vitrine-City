name: Source checks and Rojo build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  project-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Rojo mappings and source references
        run: python3 tests/check_project.py
      - name: Install Rojo 7.7.1
        run: |
          curl -fLsS https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/rojo.zip
          mkdir -p /tmp/rojo-cli
          unzip -q /tmp/rojo.zip -d /tmp/rojo-cli
          chmod +x /tmp/rojo-cli/rojo
          echo "/tmp/rojo-cli" >> "$GITHUB_PATH"
      - name: Install Luau compiler 0.744
        run: |
          curl -fLsS https://github.com/luau-lang/luau/releases/download/0.744/luau-ubuntu.zip -o /tmp/luau.zip
          mkdir -p /tmp/luau-cli
          unzip -q /tmp/luau.zip -d /tmp/luau-cli
          chmod +x /tmp/luau-cli/luau-compile /tmp/luau-cli/luau
      - name: Check Luau syntax
        run: |
          find src -name '*.luau' -print0 | xargs -0 -n 1 /tmp/luau-cli/luau-compile >/dev/null
      - name: Run economic analytics tests
        run: |
          cd tests
          /tmp/luau-cli/luau analytics.spec.luau
      - name: Test customer routes
        run: |
          cd tests
          /tmp/luau-cli/luau customer_route.spec.luau
      - name: Build all Roblox places
        run: |
          mkdir -p dist
          rojo build lobby.project.json -o dist/VitrineCity-Lobby.rbxlx
          rojo build default.project.json -o dist/VitrineCity-RuaLivre.rbxlx
          rojo build ranked.project.json -o dist/VitrineCity-GuerraComercial.rbxlx
          rojo build price_war.project.json -o dist/VitrineCity-GuerraDePrecos.rbxlx
      - name: Save playable Studio place artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VitrineCity-Places
          path: dist/*.rbxlx
          retention-days: 30
